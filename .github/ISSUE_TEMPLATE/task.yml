name: Task
description: Implementation, validation, documentation, or maintenance task.
title: "[Task]: "
labels:
  - type:task
  - status:inbox
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What is the single purpose of this task?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and out of scope
      value: |
        Scope:
        -

        Out of scope:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: standard-impact
    attributes:
      label: Standard impact
      value: |
        Affected standards:
        Downstream compatibility:
        Migration:
        Versioning decision: keep 0.1.0 until formal release / patch / minor / major
    validations:
      required: true

  - type: textarea
    id: task-contract
    attributes:
      label: Task contract
      value: |
        Owner:
        Executor type:
        AI tool:
        Reviewer:
        Integration owner:
        Write scope:
        Forbidden scope:
        Shared files:
        Dependencies:
        Task size:
        Complexity score:
        Assurance level:
        Traceability:
        Reuse or duplicate check:
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      value: |
        - [ ] python scripts/validate-standard.py
        - [ ] python scripts/run-standard-evals.py
        - [ ] git diff --check
    validations:
      required: true
