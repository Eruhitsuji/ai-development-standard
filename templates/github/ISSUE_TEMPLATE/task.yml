name: Development Task
description: Implementation, testing, documentation, or maintenance work.
title: "[Task]: "
labels:
  - type:task
  - status:inbox
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: quality-viewpoints
    attributes:
      label: Process and quality viewpoints
      value: |
        Lifecycle phase:
        Review viewpoints:
        Test viewpoints:
        Coding viewpoints:
        Security viewpoints:
    validations:
      required: true
  - type: dropdown
    id: executor-type
    attributes:
      label: Executor type
      options:
        - Human
        - AI
        - Human + AI
    validations:
      required: true
  - type: dropdown
    id: ai-tool
    attributes:
      label: AI tool
      options:
        - None
        - Codex
        - Claude Code
        - Kiro
        - Multiple
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Task contract
      value: |
        Write scope:
        Forbidden scope:
        Blocked by:
        Parallel with:
        Verification:
    validations:
      required: true
