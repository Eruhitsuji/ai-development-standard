schema_version: 1

project:
  id: example-project
  name: Example Project
  type: application
  lifecycle: initializing

process:
  primary_method: adaptive-default
  quality_gate_model: w-model

repository:
  owner: Eruhitsuji
  name: example-project
  default_branch: main

technology:
  languages: []
  runtimes: {}
  package_manager:
    type: TODO

ai:
  enabled_tools:
    - codex
    - claude-code
    - kiro

  default_roles:
    planner: human
    implementer: codex
    reviewer: claude-code
    integrator: human

guidance:
  beginner_support: true
  next_action_support: true

governance:
  task_source_of_truth: github-issues
  traceability_required: true
  capability_registry: .ai/project/CAPABILITIES.yml
  context_index: .ai/project/CONTEXT_INDEX.yml
  default_assurance_level: Standard
