schema_version: 1

repository:
  owner: Eruhitsuji
  name: example-project
  description: Example project initialized from the AI development standard.
  visibility: private
  default_branch: main

project:
  display_name: Example Project
  type: application
  lifecycle: initializing

process:
  primary_method: adaptive-default
  quality_gate_model: w-model
  planning_cadence: TODO
  release_cadence: TODO

standard:
  repository: Eruhitsuji/ai-development-standard
  version: 0.1.0
  commit: REPLACE_WITH_RELEASE_COMMIT_SHA

profiles:
  - core
  - python

ai_tools:
  codex: true
  claude_code: true
  kiro: true

guidance:
  beginner_support: true
  next_action_support: true

owners:
  maintainers:
    - Eruhitsuji
  developers: []
  reviewers: []

task_management:
  github_issues: true
  github_projects: true
  project_template: AI Development Project

branch_policy:
  require_pull_request: true
  required_approvals: 1
  require_code_owner_review: true
  require_ci: true
  allow_force_push: false
